{% extends 'store/base.html' %} 
{% block title %}Cập Nhật Sản Phẩm{% endblock %}
{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square"></i> Cập Nhật Thông Tin</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %} 
                        {{ form.as_p }}
                        
                        <div class="d-flex justify-content-between mt-4 border-top pt-3">
                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary rounded-pill px-4 fw-bold">Hủy</a>
                            <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">LƯU THAY ĐỔI</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
