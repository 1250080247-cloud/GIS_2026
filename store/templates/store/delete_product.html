{% extends 'store/base.html' %} 
{% block title %}Xác Nhận Xóa{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-danger rounded-4">
                <div class="card-body p-5 text-center">
                    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
                    <h4 class="fw-bold mt-3">Cảnh báo!</h4>
                    <p class="text-muted">Bạn có chắc chắn muốn xóa sản phẩm <br><b class="text-dark fs-5">{{ product.name }}</b>?</p>
                    <p class="small text-danger fst-italic">Hành động này không thể hoàn tác!</p>
                    
                    <form method="POST" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'dashboard' %}" class="btn btn-secondary rounded-pill px-4 fw-bold">Quay Lại</a>
                            <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold shadow">Vâng, Xóa Nó!</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
