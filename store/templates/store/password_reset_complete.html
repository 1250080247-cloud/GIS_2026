{% extends 'store/base.html' %}
{% block title %}Khôi Phục Thành Công{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 text-center">
                <div class="card-body p-5">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    <h4 class="fw-bold mt-3">Thành Công!</h4>
                    <p class="text-muted mt-3">Mật khẩu của bạn đã được đặt lại thành công. Bạn đã có thể đăng nhập bằng mật khẩu mới ngay bây giờ.</p>
                    <a href="{% url 'login' %}" class="btn btn-success rounded-pill px-5 mt-3 fw-bold shadow-sm">Đăng Nhập Ngay</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
